name: CI build

on:
  push:
    branches: [ "mainline" ]
  pull_request:
    branches: [ "mainline" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.10

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y build-essential rustup pkg-config curl exiftool exiv2 libgexiv2-2 libgexiv2-dev
    - name: Rustup
      run: rustup default stable
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
